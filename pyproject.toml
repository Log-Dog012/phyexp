[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phyxexp"
version = "0.1.0"
authors = [
  { name="Log-Dog012" }
]
description = "用于大学物理实验数据处理的Python库，支持物理量单位管理、不确定度计算、线性拟合等"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["physics", "experiment", "uncertainty", "unit", "fitting"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy",
  "uncertainties",
  "pint",
  "matplotlib"
]

[project.urls]
Homepage = "https://gitee.com/Log-Dog012/phyexp"
Repository = "https://gitee.com/Log-Dog012/phyexp"
Documentation = "https://gitee.com/Log-Dog012/phyexp-demo"

# 报告生成（nb2latex）可选依赖：pip install phyxexp[report]
[project.optional-dependencies]
report = [
  "pypandoc>=1.13",   # markdown → LaTeX（pandoc 封装，缺二进制时可自动下载）
  "nbclient>=0.9",    # 重新执行 notebook（--execute 时用）
  "nbformat>=5.5",
  "cairosvg",         # svg → png（nb2latex 转换 svg 图用）
]

# 关键新增：明确指定只打包 phyexp 包
[tool.setuptools.packages.find]
where = ["."]          # 扫描根目录
include = ["phyexp*"]  # 只包含以 phyexp 开头的文件夹